<style>
  body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 10px 20px;
    background-color: #f4f4f4;
    box-sizing: border-box;
  }

  header h1 {
    margin: 0;
    font-size: clamp(1.2rem, 2.5vw, 1.5rem);
  }

  .left-section {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 20px;
    flex-grow: 1;
  }

  .nav-links {
    display: flex;
    flex-wrap: wrap;
    list-style: none;
    margin: 0;
    padding: 0;
    gap: 15px;
  }

  .nav-links a {
    color: black;
    text-decoration: none;
    font-weight: bold;
    font-size: 0.95rem;
  }

  .nav-links a:hover {
    text-decoration: underline;
  }

  header form {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  header input[type="search"] {
    padding: 6px 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    max-width: 200px;
  }

  header button {
    padding: 6px 12px;
    border: none;
    background-color: #333;
    color: white;
    border-radius: 4px;
    cursor: pointer;
  }

  header button:hover {
    background-color: #555;
  }

  /* Accessibility class for screen readers */
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    border: 0;
  }

  @media (max-width: 600px) {
    header {
      flex-direction: column;
      align-items: stretch;
    }

    .left-section {
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }

    header form{
      width: 100%;
    }

    header input[type="search"] {
      flex-grow: 1;
      max-width: none;
    }
  }
</style>


<header>
  <div class="left-section">
    <h1>SPORTSPOT</h1>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html" target="_top">Home</a></li>
	<li><a href="#">Category</a></li>
        <li><a href="Browse.html" target="_top">Browse</a></li>
      </ul>
    </nav>
  </div>

  <form action="/search" method="GET" role="search">
    <label for="site-search" class="visually-hidden">Search the site:</label>
    <input type="search" id="site-search" name="q" placeholder="Search..." required>
    <button type="submit">Search</button>
  </form>
</header>
