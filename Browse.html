<!DOCTYPE html>
<html lang="en">


<html>

<head>
	<meta charset="UTF-8">
  	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    	<title>Browse</title>
	
	<link rel="stylesheet" href="css/styles.css">
	<link rel="stylesheet" href="css/categoryScroll.css">
</head>

<body>
	<div id="header"></div>
	
	<script>
		fetch('header.html')
	  .then(r => r.text())
	  .then(html => {
		    const container = document.getElementById('header');
		    container.innerHTML = html;
		
		    // Re-execute any <script> tags from the fetched content
		    container.querySelectorAll('script').forEach(old => {
		      const newScript = document.createElement('script');
		      if (old.src) {
		    		newScript.src = old.src;
		      } else {
		       		newScript.textContent = old.textContent;
		      }
		      old.replaceWith(newScript);
		    });
	  });   
	</script>
	<section class="sport-type">
    		<!-- Top Row: Section Heading and Button -->
    		<div class="section-header">
        		<h2 class="section-title">PickleBall</h2>
        		<button class="#">Browse PickleBall Courts</button>
    		</div>


    		<!-- The Horizontal Scrollable Row -->
    		<div class="slider-container">
        		<div class="sport-card">
				<a href="testBooking.html" target="_blank" rel="noopener noreferrer">
  					<img src="placeholder.png" alt="Court Img">
				</a>
				<h3> <a href="testBooking.html">Norgam's Pickle Ball Court</a> </h3>
        		</div>
    		</div>
	</section>

</body>
</html>
